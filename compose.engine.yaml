# Sustituye el mock por el motor real. No publica su puerto.
# docker compose -f compose.yaml -f compose.engine.yaml up --build
services:
  engine:
    image: ghcr.io/martinbjeldbak/acestream-http-proxy@sha256:2679f0473013d1b73ca56c77866ab77f4fd8874012d3f7c36b43c5adf6a8bdca
    build: !reset null
    environment: !override
      ALLOW_REMOTE_ACCESS: "yes"
    volumes:
      - engine-state:/home/appuser/.ACEStream
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:6878/webui/api/service?method=get_version
      interval: 15s
      timeout: 8s
      retries: 12
      start_period: 40s

volumes:
  engine-state:
